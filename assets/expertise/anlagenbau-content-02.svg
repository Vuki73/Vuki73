<svg xmlns="http://www.w3.org/2000/svg" width="960" height="431" viewBox="0 0 960 431" role="img" aria-label="anlagenbau: 02">
<rect width="960" height="431" rx="15" fill="#0A1421"/>
<rect x="1.5" y="1.5" width="957" height="428" rx="11" fill="none" stroke="#30495F" stroke-width="2"/>
<rect x="20" y="30" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="41" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Führung von Montagearbeiten als Vorarbeiter und Abteilungsbauleiter sowie</text>
<text x="44" y="66" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Durchführung industrieller Montageaufsicht</text>
<rect x="20" y="92" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="103" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Organisation, Überwachung und Koordination technischer Montage- und</text>
<text x="44" y="128" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Arbeitsabläufe</text>
<rect x="20" y="154" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="165" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Baufeldführung und Abstimmung mehrerer beteiligter Kontraktoren bei</text>
<text x="44" y="190" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Anlagenabstellungen</text>
<rect x="20" y="216" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="227" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Koordination von Arbeitsschnittstellen, Arbeitsfreigaben und</text>
<text x="44" y="252" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Projektbeteiligten</text>
<rect x="20" y="278" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="289" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Montageaufsicht an verfahrenstechnischen Anlagen, unter anderem an einer</text>
<text x="44" y="314" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Vollentsalzungsanlage</text>
<rect x="20" y="340" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="351" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Abstimmung von Montageabläufen unter Berücksichtigung technischer,</text>
<text x="44" y="376" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">terminlicher und sicherheitsrelevanter Vorgaben</text>
</svg>