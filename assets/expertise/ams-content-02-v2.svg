<svg xmlns="http://www.w3.org/2000/svg" width="960" height="294" viewBox="0 0 960 294" role="img" aria-label="ams: 02">
<rect width="960" height="294" rx="15" fill="#0A1421"/>
<rect x="1.5" y="1.5" width="957" height="291" rx="11" fill="none" stroke="#30495F" stroke-width="2"/>
<rect x="20" y="30" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="41" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Fachkenntnisse zur Durchführung interner SGA-Audits nach ISO 45001 und den</text>
<text x="44" y="66" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Grundsätzen der ISO 19011</text>
<rect x="20" y="92" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="103" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Planung und Vorbereitung interner Audits sowie Bewertung von SGA-Prozessen</text>
