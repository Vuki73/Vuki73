<text x="44" y="177" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Dokumentation von Auditfeststellungen, Abweichungen und</text>
<text x="44" y="202" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Verbesserungspotenzialen</text>
<rect x="20" y="228" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="239" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Nachverfolgung von Korrekturmaßnahmen und Überprüfung ihrer Wirksamkeit</text>
</svg>