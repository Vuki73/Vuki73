<svg xmlns="http://www.w3.org/2000/svg" width="960" height="308" viewBox="0 0 960 308" role="img" aria-label="SiGeKo Fachinhalte"><rect width="960" height="308" rx="15" fill="#0A1421"/><rect x="1.5" y="1.5" width="957" height="305" rx="11" fill="none" stroke="#30495F" stroke-width="2"/>
<rect x="20" y="29" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="40" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Beratung des Bauherrn und der Projektverantwortlichen zu Anforderungen der</text>
<text x="44" y="65" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Baustellenverordnung</text>
<rect x="20" y="90" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="101" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Koordination sicherheitsrelevanter Aspekte während der Planung der</text>
<text x="44" y="126" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Bauausführung</text>
<rect x="20" y="151" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="162" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Bewertung baustellenspezifischer Gefährdungen und gegenseitiger Beeinflussungen</text>
<rect x="20" y="187" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="198" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Berücksichtigung von Bauabläufen, Bauphasen und sicherheitsrelevanten</text>
<text x="44" y="223" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Schnittstellen</text>
<rect x="20" y="248" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="259" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Abstimmung organisatorischer Schutzmaßnahmen vor Aufnahme der Bauarbeiten</text></svg>