<svg xmlns="http://www.w3.org/2000/svg" width="960" height="357" viewBox="0 0 960 357" role="img"><rect width="960" height="357" rx="15" fill="#0A1421"/><rect x="1.5" y="1.5" width="957" height="354" rx="11" fill="none" stroke="#30495F" stroke-width="2"/>
<rect x="20" y="29" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="40" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Beratung der Geschäftsführung und Führungskräfte zu Sicherheit und Gesundheit</text>
<text x="44" y="65" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">bei der Arbeit</text>
<rect x="20" y="90" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="101" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Unterstützung bei der Organisation des betrieblichen Arbeitsschutzes</text>
<rect x="20" y="126" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="137" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Beratung zu Arbeitgeberpflichten, Zuständigkeiten und rechtlichen</text>
<text x="44" y="162" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Arbeitsschutzanforderungen</text>
<rect x="20" y="187" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="198" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Sicherheitstechnische Beratung zur Gestaltung von Arbeitsplätzen,</text>
<text x="44" y="223" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Arbeitsverfahren und Arbeitsumgebungen</text>
<rect x="20" y="248" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="259" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Zusammenarbeit mit Betriebsärzten, Sicherheitsbeauftragten und weiteren</text>
<text x="44" y="284" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">betrieblichen Akteuren</text>
<rect x="20" y="309" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="320" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Mitwirkung im Arbeitsschutzausschuss (ASA)</text></svg>