<svg xmlns="http://www.w3.org/2000/svg" width="960" height="356" viewBox="0 0 960 356" role="img" aria-label="ams: 03">
<rect width="960" height="356" rx="15" fill="#0A1421"/>
<rect x="1.5" y="1.5" width="957" height="353" rx="11" fill="none" stroke="#30495F" stroke-width="2"/>
<rect x="20" y="30" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="41" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Qualifizierung als BBS-Moderator mit praktischen Moderationsübungen</text>
<rect x="20" y="67" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="78" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Anwendung der BBS-Grundsätze und des ABC-Modells</text>
<rect x="20" y="104" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="115" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Förderung sicherheitsbewussten Verhaltens durch Beobachtung, Kommunikation</text>
<text x="44" y="140" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">und konstruktives Feedback</text>
<rect x="20" y="166" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="177" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Durchführung sicherheitsbezogener Moderationsgespräche mit Beschäftigten</text>
<rect x="20" y="203" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="214" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Einsatz von Beobachtungschecklisten, nachvollziehbarer Dokumentation und</text>
<text x="44" y="239" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Maßnahmenverfolgung im BBS-Prozess</text>
<rect x="20" y="265" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="276" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Unterstützung einer offenen Sicherheitskultur und aktiver</text>
<text x="44" y="301" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Mitarbeiterbeteiligung</text>
</svg>