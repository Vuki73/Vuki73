<svg xmlns="http://www.w3.org/2000/svg" width="960" height="344" viewBox="0 0 960 344" role="img" aria-label="anlagenbau: 01">
<rect width="960" height="344" rx="15" fill="#0A1421"/>
<rect x="1.5" y="1.5" width="957" height="341" rx="11" fill="none" stroke="#30495F" stroke-width="2"/>
<rect x="20" y="30" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="41" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Umfassende praktische Berufserfahrung im industriellen Rohrleitungs- und</text>
<text x="44" y="66" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Apparatebau</text>
<rect x="20" y="92" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="103" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Technisches Verständnis verfahrenstechnischer Anlagen, Rohrleitungssysteme</text>
<text x="44" y="128" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">und ihrer Komponenten</text>
<rect x="20" y="154" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="165" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Erfahrung mit Flanschverbindungen, Rohrleitungskomponenten und</text>
<text x="44" y="190" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">anlagenbezogenen Montagearbeiten</text>
<rect x="20" y="216" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="227" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Verständnis technischer Rohrleitungs-, Anlagen- und Montageunterlagen</text>
<rect x="20" y="253" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="264" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Verbindung praktischer Baustellen- und Montageerfahrung mit technischer</text>
<text x="44" y="289" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Arbeitsvorbereitung und Qualitätssicherung</text>
</svg>