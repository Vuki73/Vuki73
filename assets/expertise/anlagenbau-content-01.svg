<svg xmlns="http://www.w3.org/2000/svg" width="960" height="369" viewBox="0 0 960 369" role="img" aria-label="anlagenbau: 01">
<rect width="960" height="369" rx="15" fill="#0A1421"/>
<rect x="1.5" y="1.5" width="957" height="366" rx="11" fill="none" stroke="#30495F" stroke-width="2"/>
<rect x="20" y="30" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="41" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Praxis im industriellen Rohrleitungs- und Apparatebau – von der Montage</text>
<text x="44" y="66" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">bis zur technischen Arbeitsvorbereitung</text>
<rect x="20" y="92" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="103" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Fachkenntnisse im Aufbau und in der Montage verfahrenstechnischer Anlagen,</text>
<text x="44" y="128" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Rohrleitungssysteme und ihrer Komponenten</text>
<rect x="20" y="154" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="165" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Erfahrung mit Flanschverbindungen, Rohrleitungskomponenten und</text>
<text x="44" y="190" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">anlagenbezogenen Montagearbeiten</text>
<rect x="20" y="216" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="227" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Lesen, Auswerten und Anwenden technischer Rohrleitungs-, Anlagen- und</text>
<text x="44" y="252" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Montageunterlagen</text>
<rect x="20" y="278" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="289" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Verknüpfung von Montagepraxis, Arbeitsvorbereitung und technischer</text>
<text x="44" y="314" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Qualitätssicherung</text>
</svg>