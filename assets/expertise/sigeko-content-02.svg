<rect x="20" y="90" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="101" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Abstimmung sicherheitsrelevanter Schnittstellen zwischen Auftragnehmern und</text>
<text x="44" y="126" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Nachunternehmern</text>
<rect x="20" y="151" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="162" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Erkennen und Koordinieren von Maßnahmen gegen gegenseitige Gefährdungen</text>
