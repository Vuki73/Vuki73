<text x="44" y="259" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Abstimmung von Schutzmaßnahmen bei parallelen Bau-, Montage- und</text>
<text x="44" y="284" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Instandhaltungsarbeiten</text>
<rect x="20" y="309" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="320" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Koordination der Zusammenarbeit bei Änderungen im Bauablauf</text></svg>