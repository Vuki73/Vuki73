<svg xmlns="http://www.w3.org/2000/svg" width="960" height="369" viewBox="0 0 960 369" role="img" aria-label="SiGeKo Fachinhalte"><rect width="960" height="369" rx="15" fill="#0A1421"/><rect x="1.5" y="1.5" width="957" height="366" rx="11" fill="none" stroke="#30495F" stroke-width="2"/>
<rect x="20" y="29" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="40" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Gewerkeübergreifende Koordination gleichzeitig oder nacheinander ausgeführter</text>
