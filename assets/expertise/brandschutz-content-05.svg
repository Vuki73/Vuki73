<svg xmlns="http://www.w3.org/2000/svg" width="960" height="567" viewBox="0 0 960 567" role="img" aria-label="Brandschutz, Bereich 5 – Fachinhalte">
<rect width="960" height="567" rx="15" fill="#0A1421"/>
<rect x="1.5" y="1.5" width="957" height="564" rx="11" fill="none" stroke="#30495F" stroke-width="2"/>
<rect x="20" y="30" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="41" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Konzeption und Durchführung betrieblicher Brandschutzunterweisungen</text>
<rect x="20" y="67" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="78" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Entwicklung individuell angepasster Unterweisungskonzepte auf Grundlage</text>
<text x="44" y="103" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">betrieblicher Brandgefährdungen, Arbeitsbereiche und konkreter</text>
<text x="44" y="128" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Gefahrensituationen</text>
<rect x="20" y="154" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="165" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Planung und Durchführung der Ausbildung von Brandschutzhelfern</text>
<rect x="20" y="191" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="202" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Eigenständige Erstellung vollständiger PowerPoint-Schulungs- und</text>
<text x="44" y="227" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Ausbildungspräsentationen</text>
<rect x="20" y="253" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="264" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Konzeption, Produktion und Einsatz von Brandschutz- und Ausbildungsvideos</text>
<rect x="20" y="290" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="301" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Entwicklung praxisnaher Ausbildungsunterlagen und visueller Lernmedien für</text>
<text x="44" y="326" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Brandschutzhelfer</text>
<rect x="20" y="352" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="363" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Erstellung zielgruppenspezifischer Brandschutzunterweisungen für</text>
<text x="44" y="388" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Beschäftigte, Führungskräfte und Fremdfirmen</text>
<rect x="20" y="414" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="425" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Vermittlung von Maßnahmen zur Brandverhütung sowie zum sicheren Verhalten im</text>
<text x="44" y="450" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Brand- und Evakuierungsfall</text>
<rect x="20" y="476" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="487" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Förderung des Brandschutzbewusstseins durch anschauliche und</text>
<text x="44" y="512" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">praxisorientierte Sicherheitskommunikation</text>
</svg>