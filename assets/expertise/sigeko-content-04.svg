<svg xmlns="http://www.w3.org/2000/svg" width="960" height="319" viewBox="0 0 960 319" role="img" aria-label="SiGeKo Fachinhalte"><rect width="960" height="319" rx="15" fill="#0A1421"/><rect x="1.5" y="1.5" width="957" height="316" rx="11" fill="none" stroke="#30495F" stroke-width="2"/>
<rect x="20" y="29" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="40" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Durchführung sicherheitsbezogener Baustellenbegehungen im Rahmen der</text>
<text x="44" y="65" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">SiGeKo-Tätigkeit</text>
<rect x="20" y="90" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="101" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Organisation und Teilnahme an Sicherheits- und Koordinationsbesprechungen</text>
<rect x="20" y="126" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="137" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Feststellung und Dokumentation gewerkeübergreifender Sicherheitsrisiken</text>
<rect x="20" y="162" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="173" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Kommunikation notwendiger Maßnahmen an Bauleitung und verantwortliche</text>
<text x="44" y="198" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Unternehmen</text>
<rect x="20" y="223" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="234" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Nachverfolgung vereinbarter Koordinationsmaßnahmen</text>
<rect x="20" y="259" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="270" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Abstimmung bei Veränderungen des Bauablaufs oder der Baustellenbedingungen</text></svg>