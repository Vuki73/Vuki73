<svg xmlns="http://www.w3.org/2000/svg" width="960" height="369" viewBox="0 0 960 369" role="img" aria-label="SiGeKo Fachinhalte"><rect width="960" height="369" rx="15" fill="#0A1421"/><rect x="1.5" y="1.5" width="957" height="366" rx="11" fill="none" stroke="#30495F" stroke-width="2"/>
<rect x="20" y="29" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="40" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Koordination von Schutzmaßnahmen bei Arbeiten in der Höhe und an Absturzkanten</text>
<rect x="20" y="65" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="76" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Sicherheitsbezogene Abstimmung bei Hebe-, Kran- und Montagearbeiten</text>
<rect x="20" y="101" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="112" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Koordination gegenseitiger Gefährdungen bei gleichzeitigen Arbeiten</text>
<text x="44" y="137" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">verschiedener Gewerke</text>
<rect x="20" y="162" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="173" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Berücksichtigung sicherheitsrelevanter Schnittstellen bei Arbeiten in</text>
<text x="44" y="198" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">bestehenden Industrieanlagen</text>
<rect x="20" y="223" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="234" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Abstimmung der beteiligten Unternehmen bei besonders gefährlichen Arbeiten nach</text>
<text x="44" y="259" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Anhang II BaustellV</text>
<rect x="20" y="284" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="295" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Berücksichtigung von Sicherheitsfreigaben und betrieblichen Vorgaben an den</text>
<text x="44" y="320" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Schnittstellen zum Anlagenbetrieb</text></svg>