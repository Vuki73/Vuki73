<svg xmlns="http://www.w3.org/2000/svg" width="960" height="406" viewBox="0 0 960 406" role="img" aria-label="QS-Leitung und technische Qualitätssicherung">
<rect width="960" height="406" rx="15" fill="#0A1421"/>
<rect x="1.5" y="1.5" width="957" height="403" rx="11" fill="none" stroke="#30495F" stroke-width="2"/>
<rect x="20" y="30" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="41" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Leitung der Qualitätssicherung im Rohr- und Apparatebau</text>
<rect x="20" y="67" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="78" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Organisation und Koordination von Qualitätskontrollen im industriellen</text>
<text x="44" y="103" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Rohrleitungs- und Anlagenbau</text>
<rect x="20" y="129" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="140" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Koordination von Flanschkontrollen einschließlich Dokumentation und</text>
<text x="44" y="165" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Nachverfolgung der Prüfergebnisse</text>
<rect x="20" y="191" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="202" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Planung und Koordination von Prüfabläufen, Prüfpunkten und erforderlichen</text>
<text x="44" y="227" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">technischen Nachweisen</text>
<rect x="20" y="253" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="264" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Abstimmung der Qualitätssicherung zwischen Montage, Arbeitsvorbereitung</text>
<text x="44" y="289" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">und Prüfstellen</text>
<rect x="20" y="315" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="326" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Qualitätssicherung und Vorbereitung technischer Prüfunterlagen bei</text>
<text x="44" y="351" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">TÜV-Abstellungen verfahrenstechnischer Anlagen</text>
</svg>