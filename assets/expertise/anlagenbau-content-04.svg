<svg xmlns="http://www.w3.org/2000/svg" width="960" height="431" viewBox="0 0 960 431" role="img" aria-label="anlagenbau: 04">
<rect width="960" height="431" rx="15" fill="#0A1421"/>
<rect x="1.5" y="1.5" width="957" height="428" rx="11" fill="none" stroke="#30495F" stroke-width="2"/>
<rect x="20" y="30" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="41" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Direkte Leitung der Qualitätssicherung im Rohr- und Apparatebau für einen</text>
<text x="44" y="66" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">petrochemischen Anlagenbetreiber</text>
<rect x="20" y="92" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="103" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Organisation und Koordination von Qualitätskontrollen im industriellen</text>
<text x="44" y="128" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Rohrleitungs- und Anlagenbau</text>
<rect x="20" y="154" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="165" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Fachliche Begleitung von Flanschkontrollen und deren dokumentierter</text>
<text x="44" y="190" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Nachverfolgung</text>
<rect x="20" y="216" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="227" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Koordination von Prüfabläufen, Prüfpunkten und erforderlichen technischen</text>
<text x="44" y="252" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Nachweisen</text>
<rect x="20" y="278" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="289" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Qualitätssicherung an Schnittstellen zwischen Montage, Arbeitsvorbereitung</text>
<text x="44" y="314" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">und Prüfstellen</text>
<rect x="20" y="340" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="351" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Unterstützung der Prüfvorbereitung und Qualitätssicherung bei</text>
<text x="44" y="376" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">TÜV-Abstellungen verfahrenstechnischer Anlagen</text>
</svg>