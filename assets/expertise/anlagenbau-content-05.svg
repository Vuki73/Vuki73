<text x="44" y="289" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Entwicklung und Verbesserung praxisorientierter Qualitätssicherungs- und</text>
<text x="44" y="314" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Dokumentationskonzepte</text>
