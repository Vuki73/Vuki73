<svg xmlns="http://www.w3.org/2000/svg" width="960" height="357" viewBox="0 0 960 357" role="img"><rect width="960" height="357" rx="15" fill="#0A1421"/><rect x="1.5" y="1.5" width="957" height="354" rx="11" fill="none" stroke="#30495F" stroke-width="2"/>
<rect x="20" y="29" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="40" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Unterstützung bei der Erstellung, Überprüfung und Fortschreibung von</text>
<text x="44" y="65" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Gefährdungsbeurteilungen</text>
<rect x="20" y="90" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="101" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Systematische Ermittlung und Bewertung von Gefährdungen bei Tätigkeiten,</text>
<text x="44" y="126" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Arbeitsmitteln und Arbeitsverfahren</text>
<rect x="20" y="151" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="162" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Risikomatrizen, Maßnahmenpriorisierung und Anwendung des TOP-Prinzips</text>
<rect x="20" y="187" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="198" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Prüfung vorhandener Sicherheitsdatenblätter (SDB) und Betriebsanweisungen (BA)</text>
<text x="44" y="223" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">auf arbeitsschutzrelevante Angaben und Auffälligkeiten</text>
<rect x="20" y="248" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="259" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Beratung zur Auswahl und Anwendung geeigneter persönlicher Schutzausrüstung</text>
<text x="44" y="284" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">(PSA)</text>
<rect x="20" y="309" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="320" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Dokumentation, Maßnahmenverfolgung und Wirksamkeitskontrolle</text></svg>