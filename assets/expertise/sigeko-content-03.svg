<svg xmlns="http://www.w3.org/2000/svg" width="960" height="308" viewBox="0 0 960 308" role="img" aria-label="SiGeKo Fachinhalte"><rect width="960" height="308" rx="15" fill="#0A1421"/><rect x="1.5" y="1.5" width="957" height="305" rx="11" fill="none" stroke="#30495F" stroke-width="2"/>
<rect x="20" y="29" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="40" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Ausarbeitung beziehungsweise Veranlassung erforderlicher Sicherheits- und</text>
<text x="44" y="65" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Gesundheitsschutzpläne (SiGe-Pläne)</text>
<rect x="20" y="90" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="101" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Anpassung und Fortschreibung des SiGe-Plans bei sicherheitsrelevanten</text>
<text x="44" y="126" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Änderungen im Bauablauf</text>
<rect x="20" y="151" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="162" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Abstimmung mit Baustellenordnung und Baustelleneinrichtungsplan</text>
<rect x="20" y="187" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="198" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Mitwirkung bei Vorankündigungen gegenüber der zuständigen Behörde im Rahmen des</text>
<text x="44" y="223" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Auftrags</text>
<rect x="20" y="248" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="259" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Dokumentation und Kommunikation vereinbarter Koordinationsmaßnahmen</text></svg>