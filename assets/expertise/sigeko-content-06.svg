<svg xmlns="http://www.w3.org/2000/svg" width="960" height="297" viewBox="0 0 960 297" role="img" aria-label="SiGeKo Fachinhalte"><rect width="960" height="297" rx="15" fill="#0A1421"/><rect x="1.5" y="1.5" width="957" height="294" rx="11" fill="none" stroke="#30495F" stroke-width="2"/>
<rect x="20" y="29" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="40" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Zusammenstellung der erforderlichen Unterlage für spätere Arbeiten an der</text>
<text x="44" y="65" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">baulichen Anlage</text>
<rect x="20" y="90" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="101" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Berücksichtigung sicherheitsrelevanter Informationen für spätere Wartungs-,</text>
<text x="44" y="126" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Inspektions- und Instandhaltungsarbeiten</text>
<rect x="20" y="151" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="162" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Dokumentation relevanter Gefährdungen und vorgesehener Schutzmaßnahmen für</text>
<text x="44" y="187" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">spätere Arbeiten</text>
<rect x="20" y="212" width="8" height="8" rx="1" fill="#58DF98"/>
<text x="44" y="223" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Abstimmung und Übergabe der Unterlage an den Bauherrn beziehungsweise die</text>
<text x="44" y="248" font-size="17" font-family="Arial,DejaVu Sans,sans-serif" fill="#E1EAF5">Projektverantwortlichen</text></svg>