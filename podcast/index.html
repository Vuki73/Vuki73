<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07111e">
  <title>Podcast</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% -10%, #122b43, #07111e 62%); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #e5f2fc; }
    main { width: min(100%, 670px); padding: clamp(24px, 5vw, 44px); border: 1px solid #23445c; border-radius: 18px; background: #091726; box-shadow: 0 22px 80px #0007; }
    .mark { display: inline-flex; align-items: center; gap: 10px; color: #70d7ff; font-size: 0.93rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 750; }
    .mark::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #63dcba; box-shadow: 0 0 13px #63dcba70; }
    h1 { margin: 22px 0 25px; font-size: clamp(1.45rem, 4vw, 2.15rem); line-height: 1.28; font-weight: 650; letter-spacing: -.025em; }
    audio { display: block; width: 100%; margin: 0; accent-color: #56c9f6; }
    a { display: inline-block; color: #87dcff; margin-top: 23px; text-underline-offset: 4px; font-size: 0.94rem; }
    a:hover, a:focus-visible { color: #fff; }
    .duration { margin: 12px 0 0; color: #92aebf; font-size: .86rem; }
  </style>
</head>
<body>
  <main>
    <div class="mark">Podcast</div>
    <h1>Vom Stahlrohr zum Python-Code</h1>
    <audio controls controlslist="nodownload" preload="metadata" aria-label="Podcast abspielen">
      <source src="./Vom_Stahlrohr_zum_Python-Code_GitHub.m4a" type="audio/mp4">
      Dein Browser unterstützt die Audiowiedergabe nicht.
    </audio>
    <p class="duration">21:08</p>
  </main>
</body>
</html>
